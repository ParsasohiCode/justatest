<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 I LOVE YOU 💖</title>
  <style>
    /* Reset and full-screen base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a0b1c; /* deep romantic dark */
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* ---- moving hearts background ---- */
    .hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;  /* allows clicking through if needed */
      z-index: 1;
    }

    .heart {
      position: absolute;
      color: #ff4d6d;
      font-size: 1.8rem;
      opacity: 0.7;
      animation: floatUp 8s infinite ease-in-out;
      user-select: none;
      filter: drop-shadow(0 0 6px rgba(255, 80, 120, 0.8));
      will-change: transform, opacity;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0.2;
      }
      30% {
        opacity: 0.9;
        transform: translateY(-30px) rotate(8deg) scale(1.1);
      }
      60% {
        opacity: 0.8;
        transform: translateY(-70px) rotate(-5deg) scale(1);
      }
      100% {
        transform: translateY(-140px) rotate(10deg) scale(0.7);
        opacity: 0;
      }
    }

    /* Each heart gets a unique animation duration / delay via inline style */

    /* ---- central message ---- */
    .love-message {
      position: relative;
      z-index: 10;
      text-align: center;
      font-size: 5rem;      /* big */
      font-weight: 900;
      letter-spacing: 0.1em;
      color: #ffe5ec;
      text-shadow: 
        0 0 20px #ff4d6d,
        0 0 40px #ff1a4f,
        0 0 80px #b3002d,
        0 0 120px #7a0020;
      animation: pulseGlow 2.2s infinite alternate ease-in-out;
      transform: scale(1);
      white-space: nowrap;
      padding: 0.3em 0.2em;
      border-radius: 40px;
      background: rgba(255, 220, 235, 0.05);
      backdrop-filter: blur(1px);
      box-shadow: 0 0 80px rgba(255, 80, 120, 0.3);
    }

    @keyframes pulseGlow {
      0% {
        text-shadow: 
          0 0 20px #ff4d6d,
          0 0 40px #ff1a4f,
          0 0 80px #b3002d,
          0 0 100px #7a0020;
        transform: scale(1);
        color: #ffe5ec;
      }
      100% {
        text-shadow: 
          0 0 30px #ff7a9e,
          0 0 70px #ff3366,
          0 0 120px #ff0044,
          0 0 180px #b3002d;
        transform: scale(1.05);
        color: #fff0f5;
      }
    }

    /* decorative floating hearts around text (pseudo-elements) */
    .love-message::before,
    .love-message::after {
      content: "❤️";
      position: absolute;
      font-size: 3rem;
      opacity: 0.8;
      animation: orbitHearts 4s infinite alternate ease-in-out;
      filter: drop-shadow(0 0 12px #ff3366);
    }

    .love-message::before {
      left: -1.2em;
      top: -0.2em;
      animation-delay: 0s;
    }

    .love-message::after {
      right: -1.2em;
      bottom: -0.2em;
      animation-delay: 0.8s;
      content: "💖";
    }

    @keyframes orbitHearts {
      0% {
        transform: translateY(0) scale(0.9) rotate(-5deg);
        opacity: 0.5;
      }
      100% {
        transform: translateY(-15px) scale(1.3) rotate(5deg);
        opacity: 1;
      }
    }

    /* small hearts inside the message (background effect) */
    .love-message span {
      display: inline-block;
      animation: letterFloat 3s infinite alternate;
    }

    /* each letter gets a tiny delay */
    .love-message span:nth-child(1) { animation-delay: 0.0s; }
    .love-message span:nth-child(2) { animation-delay: 0.1s; }
    .love-message span:nth-child(3) { animation-delay: 0.2s; }
    .love-message span:nth-child(4) { animation-delay: 0.3s; }
    .love-message span:nth-child(5) { animation-delay: 0.4s; }
    .love-message span:nth-child(6) { animation-delay: 0.5s; }
    .love-message span:nth-child(7) { animation-delay: 0.6s; }
    .love-message span:nth-child(8) { animation-delay: 0.7s; }
    .love-message span:nth-child(9) { animation-delay: 0.8s; }

    @keyframes letterFloat {
      0% {
        transform: translateY(0px);
        text-shadow: 0 0 20px #ff4d6d, 0 0 40px #ff1a4f;
      }
      100% {
        transform: translateY(-10px);
        text-shadow: 0 0 35px #ff7a9e, 0 0 90px #ff0044, 0 0 140px #b3002d;
      }
    }

    /* extra little hearts floating around text (static decoration) */
    .glow-hearts {
      position: absolute;
      z-index: 5;
      font-size: 2.4rem;
      opacity: 0.5;
      animation: twinkle 3s infinite alternate;
    }

    /* Responsive: shrink text on small screens */
    @media (max-width: 700px) {
      .love-message {
        font-size: 3.2rem;
        white-space: normal;
        line-height: 1.4;
      }
      .love-message::before,
      .love-message::after {
        font-size: 2rem;
        left: -0.8em;
        right: -0.8em;
      }
      .love-message::after {
        right: -0.8em;
      }
    }

    @media (max-width: 450px) {
      .love-message {
        font-size: 2.4rem;
      }
    }

    /* twinkling stars (tiny hearts) */
    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 0.9; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- floating hearts background (generated by JS) -->
  <div class="hearts-container" id="heartsContainer"></div>

  <!-- main big message with animated letters -->
  <div class="love-message" id="loveMessage">
    <span>I</span>
    <span>&nbsp;</span>
    <span>L</span>
    <span>O</span>
    <span>V</span>
    <span>E</span>
    <span>&nbsp;</span>
    <span>Y</span>
    <span>O</span>
    <span>U</span>
  </div>

  <script>
    (function() {
      // ---- 1. Create floating hearts in the background ----
      const container = document.getElementById('heartsContainer');
      const heartSymbols = ['❤️', '💖', '💗', '💓', '💕', '💘', '💝', '🌸', '✨']; 
      // (using heart + a few sparkles for extra cuteness)
      
      const HEART_COUNT = 45; // plenty of hearts but not overwhelming

      for (let i = 0; i < HEART_COUNT; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        
        // random heart character (mostly hearts, some sparkles)
        const randSymbol = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
        heart.textContent = randSymbol;
        
        // random position
        const left = Math.random() * 100; // %
        const top = Math.random() * 100;  // %
        heart.style.left = left + '%';
        heart.style.top = top + '%';
        
        // random size
        const size = 0.8 + Math.random() * 1.8; // rem
        heart.style.fontSize = size + 'rem';
        
        // random animation duration and delay
        const duration = 6 + Math.random() * 10; // 6-16s
        const delay = Math.random() * -20; // negative so they start at different phases
        heart.style.animationDuration = duration + 's';
        heart.style.animationDelay = delay + 's';
        
        // slight opacity variation
        heart.style.opacity = 0.3 + Math.random() * 0.6;
        
        // random color tint (some pink, some red, some light purple)
        const colors = ['#ff4d6d', '#ff6b8b', '#ff8fa3', '#ffb3c6', '#ffc2d1', '#ff99aa', '#fbb1c2'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        heart.style.color = color;
        
        // extra filter for glow
        heart.style.filter = `drop-shadow(0 0 8px ${color})`;
        
        container.appendChild(heart);
      }

      // ---- 2. Extra little hearts around the message (static positioned but animated) ----
      // We'll add some small hearts positioned relative to viewport for more cuteness
      const extraHeartsPositions = [
        { top: '15%', left: '10%', size: '2rem', delay: '0s' },
        { top: '80%', left: '85%', size: '2.5rem', delay: '0.5s' },
        { top: '70%', left: '15%', size: '1.8rem', delay: '1s' },
        { top: '20%', left: '90%', size: '2.2rem', delay: '1.5s' },
        { top: '45%', left: '5%', size: '2rem', delay: '0.2s' },
        { top: '55%', left: '92%', size: '2.4rem', delay: '0.9s' },
        { top: '10%', left: '70%', size: '1.9rem', delay: '1.8s' },
        { top: '88%', left: '40%', size: '2.1rem', delay: '0.7s' },
      ];

      extraHeartsPositions.forEach((pos, idx) => {
        const heart = document.createElement('div');
        heart.className = 'glow-hearts';
        heart.textContent = idx % 2 === 0 ? '❤️' : '💖';
        heart.style.position = 'absolute';
        heart.style.top = pos.top;
        heart.style.left = pos.left;
        heart.style.fontSize = pos.size;
        heart.style.animation = `twinkle 2.5s infinite alternate ease-in-out`;
        heart.style.animationDelay = pos.delay;
        heart.style.color = '#ff99aa';
        heart.style.filter = 'drop-shadow(0 0 12px #ff4d6d)';
        heart.style.zIndex = '4';
        document.body.appendChild(heart);
      });

      // ---- 3. Optional: Add a subtle floating effect to the main message itself ----
      // (already has pulseGlow, but we can add a tiny floating drift)
      const message = document.querySelector('.love-message');
      // add a soft floating animation on top of pulseGlow
      // we do it via a wrapper? Better to add a new animation combining. 
      // Actually we can set a separate animation on the message? That would override pulseGlow.
      // Instead, we can add a pseudo or use a parent. But we'll keep it as is, 
      // the pulseGlow already gives a breathing effect.
      
      // ---- 4. Make hearts even cuter: some extra tiny sparkles with CSS ----
      // (already have sparkles in heartSymbols, good)
      
      // ---- 5. Adjust the message letters: wrap each character correctly ----
      // We already have spans in HTML for I, space, L, O, V, E, space, Y, O, U
      // But to ensure the spaces are visible and don't collapse, we use &nbsp;
      // The HTML already has &nbsp; inside a span for space? 
      // Actually I set <span>&nbsp;</span> – works fine.
      
      // ---- 6. Just for fun: make the background gradient subtle pulse? ----
      // Not necessary, but could add a slow bg shift. We'll keep it clean.
    })();
  </script>

  <!-- additional inline style to ensure spans display correctly inside love-message -->
  <style>
    .love-message span {
      display: inline-block;
      white-space: pre;
    }
    /* ensure hearts container stays behind */
    .hearts-container {
      z-index: 1;
    }
    .love-message {
      z-index: 20;
      position: relative;
    }
    /* fix for small screens to avoid overflow */
    @media (max-width: 480px) {
      .love-message {
        font-size: 2rem;
        letter-spacing: 0.05em;
      }
      .love-message::before,
      .love-message::after {
        font-size: 1.8rem;
      }
    }
  </style>
</body>
</html>
